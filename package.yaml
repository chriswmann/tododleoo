name: todo
version: 0.1.0.0
github: "chriswmann/tododleoo"
license: BSD-3-Clause
author: "Christopher Mann"
maintainer: "8133496+chriswmann@users.noreply.github.com"
copyright: "Christopher Mann"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            General

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/chriswmann/tododleoo#readme>

dependencies:
  - base >= 4.7 && < 5
  - array
  - aeson
  - aeson-pretty
  - bytestring
  - containers
  - directory
  - filepath
  - text
  - time

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  todo-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - todo

tests:
  todo-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - todo
      - hspec
      - quickcheck-instances
      - QuickCheck
    build-tools:
      - hspec-discover
